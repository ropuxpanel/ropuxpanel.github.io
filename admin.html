<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
<style>
#logBox{height:60vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.lg{max-width:92%;padding:9px 12px;border-radius:14px 14px 14px 4px;background:rgba(127,127,127,.15);font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.lg small{display:block;opacity:.6;font-size:11px;margin-top:3px}
.lg.new{border-left:3px solid #f59e0b}.lg.ok{border-left:3px solid #22c55e}.lg.bad{border-left:3px solid #ef4444}.lg.mail{border-left:3px solid #3b82f6}
</style>
</head>
<body>
<header><h1>⚙ Admin Panel</h1><div id="userBox"></div></header>
<div class="wrap">

<div id="loginView" class="box"><p>Admin Google account দিয়ে login করো।</p><br><button class="btn" id="loginBtn">Google Login</button></div>
<div id="denied" class="box hide">❌ এই account admin না।</div>

<div id="panel" class="hide">
  <div class="tabs">
    <button class="btn ghost active" data-t="orders">💰 Orders</button>
    <button class="btn ghost" data-t="upload">⬆ নতুন ফাইল</button>
    <button class="btn ghost" data-t="files">📦 ফাইল লিস্ট</button>
    <button class="btn ghost" data-t="settings">🛠 Settings</button>
    <button class="btn ghost" data-t="log">🤖 Log <span id="logDot"></span></button>
  </div>

  <!-- ORDERS -->
  <div class="box" id="t-orders">
    <div class="row" style="margin-bottom:10px">
      <select id="ofilter"><option value="pending">Pending</option><option value="all">সব</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
    </div>
    <div style="overflow-x:auto"><table><thead><tr><th>User</th><th>ফাইল</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody id="orders"></tbody></table></div>
  </div>

  <!-- UPLOAD -->
  <div class="box hide" id="t-upload">
    <h3 id="formTitle">নতুন ফাইল পাবলিশ</h3>
    <label>নাম</label><input id="fName">
    <div class="row">
      <div><label>দাম (BDT)</label><input id="fPrice" type="number"></div>
      <div><label>Version</label><input id="fVer" placeholder="1.0"></div>
      <div><label>Category</label><input id="fCat" placeholder="App / Game / Template"></div>
    </div>
    <label>বিবরণ</label><textarea id="fDesc" rows="5"></textarea>
    <label>মূল ফাইল (apk/zip/যেকোনো) — size অটো</label><input type="file" id="fFile">
    <label>Icon</label><input type="file" id="fIcon" accept="image/*">
    <label>Screenshots (একাধিক)</label><input type="file" id="fShots" accept="image/*" multiple>
    <div class="bar hide" id="bar"><i></i></div>
    <p class="meta" id="stat"></p><br>
    <button class="btn ok" id="publish">🚀 Publish</button>
  </div>

  <!-- FILES -->
  <div class="box hide" id="t-files"><div style="overflow-x:auto"><table><tbody id="files"></tbody></table></div></div>

  <!-- LOG -->
  <div class="box hide" id="t-log">
    <div class="row" style="margin-bottom:10px"><span class="meta">সব activity এখানে লেখা থাকে (এই browser এ save হয়)</span><button class="btn ghost" id="logClear">🗑 Clear</button></div>
    <div id="logBox"></div>
  </div>

  <!-- SETTINGS -->
  <div class="box hide" id="t-settings">
    <label>সেল সম্পর্কিত তথ্য (হোমপেজে দেখাবে)</label><textarea id="sSell" rows="3"></textarea>
    <label>About</label><textarea id="sAbout" rows="2"></textarea>
    <div class="row">
      <div><label>bKash নম্বর</label><input id="sBkash"></div>
      <div><label>Nagad নম্বর</label><input id="sNagad"></div>
    </div>
    <div class="row">
      <div><label>Facebook link</label><input id="sFb"></div>
      <div><label>WhatsApp নম্বর</label><input id="sWa"></div>
    </div>
    <div class="row">
      <div><label>Phone</label><input id="sPhone"></div>
      <div><label>Email</label><input id="sEmail"></div>
    </div>
    <button class="btn" id="saveSet">Save</button>
  </div>
</div>
</div>

<script type="module">
import { firebaseConfig, CLOUD_NAME, UPLOAD_PRESET, ADMIN_EMAILS, NOTIFY_URL } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2800); };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(2) + " MB" : (b / 1024).toFixed(1) + " KB";

$("#loginBtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast(e.code));

// ---- Activity log (localStorage) ----
const LOG_KEY = "ropu_admin_log";
let logs = []; try { logs = JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch {}
const fmtT = t => new Date(t).toLocaleString("bn-BD", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function drawLog() {
  const bx = $("#logBox"); if (!bx) return;
  bx.innerHTML = logs.length ? logs.map(l => `<div class="lg ${l.k || ""}">${esc(l.m)}<small>${fmtT(l.t)}</small></div>`).join("") : `<p class="meta">এখনো কোনো activity নেই।</p>`;
  bx.scrollTop = bx.scrollHeight;
}
function logMsg(m, k, key, t) {
  if (key && logs.some(l => l.key === key)) return false;
  logs.push({ m, k, key, t: t || Date.now() });
  logs = logs.slice(-500);
  try { localStorage.setItem(LOG_KEY, JSON.stringify(logs)); } catch {}
  drawLog();
  if ($("#t-log") && $("#t-log").classList.contains("hide")) $("#logDot").textContent = "🔴";
  return true;
}
function syncLog(list) {
  [...list].reverse().forEach(o => {
    const ts = o.createdAt && o.createdAt.toMillis ? o.createdAt.toMillis() : Date.now();
    logMsg(`🛒 নতুন order এসেছে\nফাইল: ${o.fileName} — ৳${o.price}\nUser: ${o.userName} (${o.email})\n${o.method} · TrxID: ${o.trxId} · From: ${o.senderNumber}\n📧 Admin কে email পাঠানোর অনুরোধ গেছে\nOrder ID: ${o.id}`, "new", "new:" + o.id + ":" + ts, ts);
    if (o.status === "approved") logMsg(`✅ Order approved\n${o.fileName} — ${o.email}${o.downloaded ? "\n⬇ User ডাউনলোড করেছে" : ""}`, "ok", "ap:" + o.id + ":" + ts);
    if (o.status === "approved" && o.downloaded) logMsg(`⬇ ${o.email} "${o.fileName}" ডাউনলোড করেছে (আর পাবে না)`, "ok", "dl:" + o.id + ":" + ts);
    if (o.status === "rejected") logMsg(`❌ Order rejected\n${o.fileName} — ${o.email}\nকারণ: ${o.reason || "—"}`, "bad", "rj:" + o.id + ":" + (o.reason || ""));
  });
}

let started = false, allOrders = [];
onAuthStateChanged(auth, u => {
  $("#userBox").innerHTML = u ? `<span class="meta">${esc(u.email)}</span> <button class="btn ghost" id="out">Logout</button>` : "";
  if ($("#out")) $("#out").onclick = () => signOut(auth);
  $("#loginView").classList.toggle("hide", !!u);
  const ok = u && ADMIN_EMAILS.includes(u.email);
  $("#denied").classList.toggle("hide", !(u && !ok));
  $("#panel").classList.toggle("hide", !ok);
  if (ok && !started) { started = true; drawLog(); logMsg("🟢 Admin panel চালু হয়েছে (" + u.email + ")", "", null); start(); }
});

// tabs
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("active", x === b));
  ["orders", "upload", "files", "settings", "log"].forEach(t => $("#t-" + t).classList.toggle("hide", t !== b.dataset.t));
  if (b.dataset.t === "log") { $("#logDot").textContent = ""; const bx = $("#logBox"); bx.scrollTop = bx.scrollHeight; }
});

function start() {
  // orders
  onSnapshot(query(collection(db, "orders"), orderBy("createdAt", "desc")), s => {
    allOrders = s.docs.map(d => ({ id: d.id, ...d.data() })); syncLog(allOrders); drawOrders();
  }, e => { console.error(e); $("#orders").innerHTML = `<tr><td colspan="5" class="meta">Error: ${esc(e.code || e.message)}</td></tr>`; toast("Orders error: " + (e.code || e.message)); });
  $("#ofilter").onchange = drawOrders;
  $("#logClear").onclick = () => { if (confirm("Log মুছে ফেলবে?")) { logs = []; try { localStorage.removeItem(LOG_KEY); } catch {} drawLog(); } };
  // files
  onSnapshot(query(collection(db, "files"), orderBy("createdAt", "desc")), s => {
    $("#files").innerHTML = s.docs.map(d => { const x = d.data(); return `<tr>
      <td data-l="Icon"><img src="${esc(x.iconUrl)}" width="44" height="44" style="border-radius:12px;object-fit:cover"></td>
      <td data-l="নাম"><span><b>${esc(x.name)}</b><br><span class="meta">${esc(x.sizeText)}</span></span></td>
      <td data-l="দাম ৳"><input value="${esc(x.price)}" type="number" style="width:110px;margin:0" data-p="${d.id}"></td>
      <td><button class="btn ghost" data-s="${d.id}">Save</button> <button class="btn bad" data-d="${d.id}">Delete</button></td></tr>`; }).join("");
    document.querySelectorAll("[data-s]").forEach(b => b.onclick = async () => {
      await updateDoc(doc(db, "files", b.dataset.s), { price: Number(document.querySelector(`[data-p="${b.dataset.s}"]`).value) }); toast("Updated"); logMsg("💲 ফাইলের দাম আপডেট: " + document.querySelector(`[data-p="${b.dataset.s}"]`).value + " ৳ (ID " + b.dataset.s + ")");
    });
    document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
      if (!confirm("মুছে ফেলবে?")) return;
      await deleteDoc(doc(db, "files", b.dataset.d, "secret", "data")).catch(() => {});
      await deleteDoc(doc(db, "files", b.dataset.d)); toast("Deleted"); logMsg("🗑 ফাইল মুছে ফেলা হয়েছে (ID " + b.dataset.d + ")", "bad");
    });
  }, e => { console.error(e); toast("Files error: " + (e.code || e.message)); });
  // settings
  getDoc(doc(db, "settings", "site")).then(s => {
    const d = s.data() || {};
    $("#sSell").value = d.sellInfo || ""; $("#sAbout").value = d.about || "";
    $("#sBkash").value = d.bkash || ""; $("#sNagad").value = d.nagad || "";
    $("#sFb").value = d.facebook || ""; $("#sWa").value = d.whatsapp || "";
    $("#sPhone").value = d.phone || ""; $("#sEmail").value = d.email || "";
  });
}

async function notifyUser(o) {
  if (!o || !NOTIFY_URL) return;
  try {
    let tokens = [];
    try { const t = await getDoc(doc(db, "tokens", o.uid)); tokens = (t.data() || {}).tokens || []; } catch {}
    const r = await fetch(NOTIFY_URL, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + await auth.currentUser.getIdToken() },
      body: JSON.stringify({ type: "approved", orderId: o.id, tokens }) });
    const j = await r.json().catch(() => ({}));
    toast(r.ok ? `Email ${j.mail === 200 ? "✔" : "✖ " + j.mail}${tokens.length ? " · Push ✔" : " · Push নেই"}` : "Notify error: " + (j.error || r.status));
    logMsg(r.ok ? `${j.mail === 200 ? "📧 Approve email পাঠানো হয়েছে" : "⚠ Email যায়নি (code " + j.mail + ")"}: ${o.email}\n${tokens.length ? "🔔 Push notification পাঠানো হয়েছে" : "🔕 Push নেই (user notification চালু করেনি)"}` : "⚠ Notify error: " + (j.error || r.status), r.ok && j.mail === 200 ? "mail" : "bad");
  } catch (e) { toast("Notify error: " + e.message); logMsg("⚠ Notify error: " + e.message, "bad"); }
}

function drawOrders() {
  const f = $("#ofilter").value;
  const list = allOrders.filter(o => f === "all" || o.status === f);
  $("#orders").innerHTML = list.map(o => `<tr>
    <td data-l="User"><span>${esc(o.userName)}<br><span class="meta">${esc(o.email)}</span></span></td>
    <td data-l="ফাইল"><span>${esc(o.fileName)}<br><b>৳${esc(o.price)}</b></span></td>
    <td data-l="Payment"><span>${esc(o.method)}<br>TrxID: <b>${esc(o.trxId)}</b><br><span class="meta">From: ${esc(o.senderNumber)}</span></span></td>
    <td data-l="Status"><span><span class="badge b-${o.status}">${o.status}</span>${o.reason ? `<br><span class="meta">${esc(o.reason)}</span>` : ""}</span></td>
    <td>${o.status === "pending" ? `<button class="btn ok" data-a="${o.id}">Approve</button> <button class="btn bad" data-r="${o.id}">Reject</button>` : ""}</td></tr>`).join("")
    || `<tr><td colspan="5" class="meta">কিছু নেই</td></tr>`;
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      await updateDoc(doc(db, "orders", b.dataset.a), { status: "approved", reason: "", downloaded: false });
      toast("Approved");
      notifyUser(allOrders.find(x => x.id === b.dataset.a));
    } catch (e) { toast("Error: " + (e.code || e.message)); b.disabled = false; }
  });
  document.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    const r = prompt("Reject এর কারণ:", "Transaction ID ভুল / টাকা পাইনি"); if (r === null) return;
    updateDoc(doc(db, "orders", b.dataset.r), { status: "rejected", reason: r }).then(() => toast("Rejected"));
  });
}

// ---- Cloudinary upload ----
function upload(file, onP) {
  return new Promise((res, rej) => {
    const fd = new FormData(); fd.append("file", file); fd.append("upload_preset", UPLOAD_PRESET);
    const x = new XMLHttpRequest();
    x.open("POST", `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`);
    x.upload.onprogress = e => e.lengthComputable && onP && onP(e.loaded / e.total);
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch {} x.status < 300 ? res(j) : rej(new Error(j.error?.message || "upload failed")); };
    x.onerror = () => rej(new Error("network error"));
    x.send(fd);
  });
}

$("#publish").onclick = async () => {
  const name = $("#fName").value.trim(), price = Number($("#fPrice").value);
  const file = $("#fFile").files[0], icon = $("#fIcon").files[0], shots = [...$("#fShots").files];
  if (!name || !price || !file || !icon) return toast("নাম, দাম, ফাইল ও icon লাগবেই");
  const btn = $("#publish"); btn.disabled = true; $("#bar").classList.remove("hide");
  const setBar = p => $("#bar i").style.width = (p * 100) + "%";
  try {
    $("#stat").textContent = "Icon আপলোড...";
    const ic = await upload(icon);
    const sh = [];
    for (let i = 0; i < shots.length; i++) { $("#stat").textContent = `Screenshot ${i + 1}/${shots.length}...`; sh.push((await upload(shots[i])).secure_url); }
    $("#stat").textContent = "মূল ফাইল আপলোড...";
    const mf = await upload(file, setBar);
    const ref = await addDoc(collection(db, "files"), {
      name, price, description: $("#fDesc").value, version: $("#fVer").value.trim(), category: $("#fCat").value.trim(),
      size: file.size, sizeText: fmtSize(file.size), iconUrl: ic.secure_url, screenshots: sh, createdAt: serverTimestamp()
    });
    await setDoc(doc(db, "files", ref.id, "secret", "data"), { url: mf.secure_url, publicId: mf.public_id });
    toast("Publish হয়েছে ✔"); $("#stat").textContent = ""; logMsg(`🚀 নতুন ফাইল publish: ${name} — ৳${price} (${fmtSize(file.size)})`, "ok");
    ["fName", "fPrice", "fVer", "fCat", "fDesc", "fFile", "fIcon", "fShots"].forEach(i => $("#" + i).value = "");
  } catch (e) { toast("Error: " + e.message); $("#stat").textContent = "❌ " + e.message; }
  btn.disabled = false; setBar(0); $("#bar").classList.add("hide");
};

$("#saveSet").onclick = async () => {
  await setDoc(doc(db, "settings", "site"), {
    sellInfo: $("#sSell").value, about: $("#sAbout").value, bkash: $("#sBkash").value.trim(), nagad: $("#sNagad").value.trim(),
    facebook: $("#sFb").value.trim(), whatsapp: $("#sWa").value.trim(), phone: $("#sPhone").value.trim(), email: $("#sEmail").value.trim()
  }); toast("Saved ✔"); logMsg("🛠 Settings সেভ করা হয়েছে");
};
</script>
</body>
</html>
