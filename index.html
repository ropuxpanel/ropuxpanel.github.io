<!DOCTYPE html>
<html lang="bn" class="store">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSM Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="ann hide" id="ann"></div>
<header>
  <h1 id="siteName"><a href="index.html" style="color:inherit">CSM Store</a></h1>
  <div id="userBox"><button class="btn" id="loginBtn">Google দিয়ে Sign in</button></div>
</header>

<div class="wrap" id="app">লোড হচ্ছে...</div>

<footer id="contact"></footer>
<div class="fab hide" id="fab"><div class="fab-menu" id="fabMenu"></div><button class="fab-main" id="fabBtn" aria-label="Contact"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></button></div>

<script type="module">
import { firebaseConfig, SITE_NAME, VAPID_KEY, NOTIFY_URL } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, arrayUnion, where, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getMessaging, getToken, onMessage, isSupported } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app), db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const toast = m => { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2800); };
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "app";


let user = null, settings = {}, current = null;

$("#loginBtn").onclick = login;
async function login() {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { toast("Login হয়নি: " + e.code); }
}
onAuthStateChanged(auth, u => {
  user = u;
  $("#userBox").innerHTML = u
    ? `<span class="meta">${esc(u.displayName)}</span> <button class="btn ghost" id="outBtn">Logout</button>`
    : `<button class="btn" id="loginBtn2">Google দিয়ে Sign in</button>`;
  if ($("#outBtn")) $("#outBtn").onclick = () => signOut(auth);
  if ($("#loginBtn2")) $("#loginBtn2").onclick = login;
  if (current) renderDetail(current);
  if (u) { checkApproved(); if ("Notification" in window && Notification.permission === "granted") enableNotif(); }
});

// ---- Push notification ----
let msgBound = false;
async function enableNotif() {
  try {
    if (!user) return false;
    if (!VAPID_KEY || !("Notification" in window) || !(await isSupported())) { toast("এই browser এ notification support নেই (Chrome/Safari এ সাইট ওপেন করো)"); return false; }
    if (Notification.permission === "default") await Notification.requestPermission();
    if (Notification.permission !== "granted") { toast("Notification permission দাওনি"); return false; }
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js");
    const m = getMessaging(app);
    const token = await getToken(m, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (token) await setDoc(doc(db, "tokens", user.uid), { tokens: arrayUnion(token), email: user.email }, { merge: true });
    if (!msgBound) { msgBound = true; onMessage(m, p => { toast((p.notification && p.notification.title) || "Notification"); checkApproved(); if (current) renderBuy(current); }); }
    return !!token;
  } catch (e) { console.error(e); toast("Notification error: " + (e.code || e.message)); return false; }
}

// ---- Approved popup + one-time download ----
async function checkApproved() {
  if (!user) return;
  try {
    const s = await getDocs(query(collection(db, "orders"), where("uid", "==", user.uid)));
    const list = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(o => o.status === "approved" && o.downloaded !== true);
    if (list.length) showApproved(list);
  } catch (e) { console.error(e); }
}
function showApproved(list) {
  const old = $("#apPop"); if (old) old.remove();
  const el = document.createElement("div"); el.id = "apPop";
  el.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px";
  el.innerHTML = `<div class="box" style="max-width:420px;width:100%;max-height:85vh;overflow:auto">
    <h3>✅ Payment Approved!</h3>
    <p class="meta" style="margin:8px 0 14px">⚠ এটা paid ফাইল — একবারই ডাউনলোড করা যাবে। ডাউনলোড বাটনে চাপলেই আর পাবে না।</p>
    ${list.map(o => `<div style="margin-bottom:10px"><b>${esc(o.fileName)}</b><br><button class="btn ok" data-dl="${esc(o.id)}">⬇ Download (একবার)</button></div>`).join("")}
    <button class="btn ghost" id="apClose">পরে করবো</button></div>`;
  document.body.append(el);
  $("#apClose").onclick = () => el.remove();
  el.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => downloadOrder(list.find(o => o.id === b.dataset.dl), b));
}
async function downloadOrder(o, btn) {
  if (!confirm("একবারই ডাউনলোড করা যাবে। এখনই ডাউনলোড করবে?")) return;
  btn.disabled = true;
  try {
    const s = await getDoc(doc(db, "files", o.fileId, "secret", "data"));
    const url = s.data().url;
    await updateDoc(doc(db, "orders", o.id), { downloaded: true });
    const p = $("#apPop"); if (p) p.remove();
    toast("ডাউনলোড শুরু হচ্ছে...");
    setTimeout(() => { location.href = url; }, 300);
  } catch (e) { toast("Error: " + (e.code || e.message)); btn.disabled = false; }
}

// ---- settings helpers (সব লেখা admin থেকে বদলানো যায়) ----
const T = (k, d) => { const v = settings[k]; return v && String(v).trim() ? String(v) : d; };
const L = (k, d) => T(k, d).split("\n").map(s => s.trim()).filter(Boolean);
const okHex = h => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(h || "").trim());
const lum = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b; };
const DEF_TRUST = "⚡|দ্রুত ভেরিফিকেশন|পেমেন্টের কয়েক মিনিটের মধ্যেই\n🔒|নিরাপদ পেমেন্ট|bKash / Nagad এ সরাসরি\n⬇|ইনস্ট্যান্ট ডাউনলোড|Approve হলেই ডাউনলোড চালু\n💬|সাপোর্ট|যেকোনো সমস্যায় পাশে আছি";
const DEF_STEPS = "Google দিয়ে Sign in করো\nbKash / Nagad এ টাকা পাঠাও\nTransaction ID দাও\nApprove হলেই ডাউনলোড";

function applyTheme() {
  const r = document.documentElement.style, a = okHex(settings.accent) ? settings.accent.trim() : null, b = okHex(settings.accent2) ? settings.accent2.trim() : null;
  if (a) { r.setProperty("--pri", a); r.setProperty("--onpri", lum(a) > .55 ? "#151008" : "#ffffff"); }
  if (b) r.setProperty("--pri2", b);
  const n = T("brandName", SITE_NAME); document.title = n;
  const logo = settings.logoUrl ? `<img class="mark" src="${esc(settings.logoUrl)}" alt="">` : `<span class="mark">${esc([...n][0] || "S")}</span>`;
  $("#siteName").innerHTML = `<a href="index.html" class="brand">${logo}<span>${esc(n)}</span></a>`;
  const ann = $("#ann"); ann.textContent = T("announce", ""); ann.classList.toggle("hide", !T("announce", ""));
}

async function boot() {
  try { const s = await getDoc(doc(db, "settings", "site")); settings = s.exists() ? s.data() : {}; } catch {}
  applyTheme(); renderContact(); renderFab();
  const p = new URLSearchParams(location.search).get("app");
  if (p) {
    const id = p.split("-").pop();
    let d; try { d = await getDoc(doc(db, "files", id)); } catch (e) { d = { exists: () => false }; }
    if (!d.exists()) { $("#app").innerHTML = `<div class="box">ফাইল পাওয়া যায়নি। <a href="index.html">হোমে যাও</a></div>`; return; }
    current = { id, ...d.data() };
    renderDetail(current);
  } else renderHome();
}

function renderContact() {
  const s = settings, n = T("brandName", SITE_NAME), links = [];
  if (s.facebook) links.push(`<a href="${esc(s.facebook)}" target="_blank" rel="noopener">Facebook</a>`);
  if (s.whatsapp) links.push(`<a href="https://wa.me/${esc(String(s.whatsapp).replace(/\D/g, ""))}" target="_blank" rel="noopener">WhatsApp</a>`);
  if (s.phone) links.push(`<a href="tel:${esc(s.phone)}">📞 ${esc(s.phone)}</a>`);
  if (s.email) links.push(`<a href="mailto:${esc(s.email)}">✉ ${esc(s.email)}</a>`);
  $("#contact").innerHTML = `<div class="fbrand"><span class="mark">${esc([...n][0] || "S")}</span>${esc(n)}</div>
    ${s.about ? `<p>${esc(s.about)}</p>` : ""}<div class="links">${links.join("")}</div>
    <p class="meta" style="margin-top:20px">${esc(T("copyText", "© " + new Date().getFullYear() + " " + n + ". All rights reserved."))}</p>`;
}

function renderFab() {
  const s = settings, it = [];
  const chat = '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
  const phone = '<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';
  const mail = '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
  if (s.whatsapp) it.push([`https://wa.me/${String(s.whatsapp).replace(/\D/g, "")}`, "WhatsApp", "#25d366", chat]);
  if (s.facebook) it.push([s.facebook, "Messenger / Facebook", "#0a84ff", chat]);
  if (s.phone) it.push([`tel:${s.phone}`, "কল করুন", "#8b5cf6", phone]);
  if (s.email) it.push([`mailto:${s.email}`, "Email", "#ea4335", mail]);
  const fab = $("#fab"); if (!it.length) return fab.classList.add("hide");
  fab.classList.remove("hide");
  $("#fabMenu").innerHTML = it.map(([h, l, c, svg]) => `<a class="fab-item" href="${esc(h)}" target="_blank" rel="noopener"><span>${esc(l)}</span><i style="background:${c}">${svg}</i></a>`).join("");
  $("#fabBtn").onclick = () => fab.classList.toggle("open");
}

async function renderHome() {
  const trust = L("trustItems", DEF_TRUST).map(x => { const [i, t, d] = x.split("|"); return `<div class="tr"><span class="tr-i">${esc(i || "✦")}</span><div><b>${esc(t || "")}</b><small>${esc(d || "")}</small></div></div>`; }).join("");
  $("#app").innerHTML = `
    <section class="hero">
      <span class="hbadge">${esc(T("heroBadge", "✦ Premium Digital Store"))}</span>
      <h2>${esc(T("heroTitle", "প্রিমিয়াম"))} <span>${esc(T("heroHighlight", "অ্যাপ ও ফাইল"))}</span><br>${esc(T("heroTitle2", "এক জায়গায়"))}</h2>
      <p>${esc(T("sellInfo", "পছন্দের ফাইল বেছে নাও, bKash / Nagad এ পেমেন্ট করো, ভেরিফাই হলেই ডাউনলোড।"))}</p>
      <div class="search"><input id="q" placeholder="${esc(T("searchPlaceholder", "ফাইল খুঁজুন..."))}"></div>
    </section>
    <div class="trust">${trust}</div>
    <div class="sec-head"><h3>${esc(T("allFilesTitle", "সব ফাইল"))}</h3>
      <select id="sortSel"><option value="new">নতুন আগে</option><option value="low">দাম কম → বেশি</option><option value="high">দাম বেশি → কম</option></select></div>
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid">${'<div class="sk"></div>'.repeat(6)}</div>`;
  let items = [];
  try { const snap = await getDocs(query(collection(db, "files"), orderBy("createdAt", "desc"))); items = snap.docs.map(d => ({ id: d.id, ...d.data() })); }
  catch (e) { console.error(e); toast("Error: " + (e.code || e.message)); }
  let cat = "", term = "", sort = "new";
  const allLabel = T("allLabel", "সব");
  const cats = [...new Set(items.map(x => (x.category || "").trim()).filter(Boolean))];
  const drawCats = () => {
    $("#cats").innerHTML = cats.length ? [["", allLabel], ...cats.map(c => [c, c])].map(([v, l]) => `<button class="${v === cat ? "on" : ""}" data-c="${esc(v)}">${esc(l)}</button>`).join("") : "";
    document.querySelectorAll("#cats button").forEach(b => b.onclick = () => { cat = b.dataset.c; drawCats(); draw(); });
  };
  const draw = () => {
    let list = items.filter(x => (!cat || (x.category || "").trim() === cat) && String(x.name || "").toLowerCase().includes(term.toLowerCase()));
    if (sort === "low") list.sort((a, b) => a.price - b.price); else if (sort === "high") list.sort((a, b) => b.price - a.price);
    $("#grid").innerHTML = list.length ? list.map((x, i) => `
      <div class="pcard" style="animation-delay:${i * 45}ms" onclick="location.href='?app=${slug(x.name)}-${x.id}'">
        <div class="pimg"><img src="${esc(x.iconUrl)}" alt="" loading="lazy">${x.category ? `<span class="pcat">${esc(x.category)}</span>` : ""}</div>
        <div class="pbody"><h3>${esc(x.name)}</h3>
          <div class="pmeta">${x.version ? "v" + esc(x.version) + " · " : ""}${esc(x.sizeText)}</div>
          <div class="pfoot"><span class="price">৳${esc(x.price)}</span><span class="pbtn">দেখো →</span></div></div>
      </div>`).join("") : `<p class="meta" style="grid-column:1/-1;text-align:center;padding:40px">${esc(T("emptyText", "কোনো ফাইল পাওয়া যায়নি"))}</p>`;
  };
  drawCats(); draw();
  $("#q").oninput = e => { term = e.target.value; draw(); };
  $("#sortSel").onchange = e => { sort = e.target.value; draw(); };
}

async function renderDetail(f) {
  window.scrollTo(0, 0);
  $("#app").innerHTML = `
    <a class="back" href="index.html">${esc(T("backText", "← সব ফাইল"))}</a>
    <div class="detail">
      <div>
        <div class="box" style="margin-top:8px">
          <div class="dhead">
            <img src="${esc(f.iconUrl)}" alt="">
            <div>
              <h2>${esc(f.name)}</h2>
              <div class="dprice">৳${esc(f.price)}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap">
                <span class="chip">📦 ${esc(f.sizeText)}</span>
                ${f.version ? `<span class="chip">v${esc(f.version)}</span>` : ""}
                ${f.category ? `<span class="chip">${esc(f.category)}</span>` : ""}
              </div>
            </div>
          </div>
        </div>
        ${(f.screenshots || []).length ? `<div class="box"><h3>${esc(T("shotsTitle", "Screenshots"))}</h3><div class="shots">${f.screenshots.map(u => `<img src="${esc(u)}" loading="lazy">`).join("")}</div></div>` : ""}
        <div class="box"><h3>${esc(T("descTitle", "বিবরণ"))}</h3><p style="white-space:pre-wrap;color:var(--mut)">${esc(f.description)}</p></div>
      </div>
      <div class="side"><div class="box" id="buyBox" style="margin-top:8px"></div></div>
    </div>`;
  document.querySelectorAll(".shots img").forEach(im => im.onclick = () => {
    const lb = document.createElement("div"); lb.className = "lightbox"; lb.innerHTML = `<img src="${im.src}">`;
    lb.onclick = () => lb.remove(); document.body.append(lb);
  });
  renderBuy(f);
}

const sumBox = f => `<div class="co-sum"><img src="${esc(f.iconUrl)}" alt=""><div><b>${esc(f.name)}</b><span>${f.version ? "v" + esc(f.version) + " · " : ""}${esc(f.sizeText)}</span></div><div class="co-price">৳${esc(f.price)}</div></div>`;

async function renderBuy(f) {
  const box = $("#buyBox");
  if (!user) {
    box.innerHTML = `<div class="co"><div class="co-title">🛒 ${esc(T("buyTitle", "কিনতে চাও?"))}</div>${sumBox(f)}
      <ol class="steps">${L("buySteps", DEF_STEPS).map(s => `<li>${esc(s)}</li>`).join("")}</ol>
      <button class="btn ok big" id="buyBtn">${esc(T("buyBtnText", "🛒 এখনই কিনুন"))} — ৳${esc(f.price)}</button>
      <div class="co-note">${esc(T("payNote", "🔒 তোমার তথ্য সুরক্ষিত। Admin যাচাইয়ের পর ডাউনলোড চালু হবে।"))}</div></div>`;
    $("#buyBtn").onclick = login; return;
  }
  box.innerHTML = `<div class="meta">চেক করা হচ্ছে...</div>`;
  const oid = `${user.uid}_${f.id}`;
  let o = null;
  try { const od = await getDoc(doc(db, "orders", oid)); o = od.exists() ? od.data() : null; }
  catch (e) { console.error(e); toast("Error: " + e.code); }

  if (o && o.status === "approved") {
    if (o.downloaded === true) {
      box.innerHTML = `<div class="stt"><div class="big-i">✅</div><span class="badge b-approved">Approved ✔</span><p>এই ফাইল আগেই ডাউনলোড করা হয়েছে। Paid ফাইল তাই আর ডাউনলোড করা যাবে না।</p></div>`;
      return;
    }
    box.innerHTML = `<div class="stt"><div class="big-i">🎉</div><span class="badge b-approved">Approved ✔</span>
      <p>পেমেন্ট ভেরিফাইড! ⚠ একবারই ডাউনলোড করা যাবে।</p>
      <button class="btn ok big" id="dlBtn">⬇ Download (একবার)</button></div>`;
    $("#dlBtn").onclick = () => downloadOrder({ id: oid, fileId: f.id }, $("#dlBtn"));
    return;
  }
  if (o && o.status === "pending") {
    box.innerHTML = `<div class="stt"><div class="big-i">⏳</div><span class="badge b-pending">Pending</span>
      <p>তোমার TrxID <b style="color:var(--txt)">${esc(o.trxId)}</b> যাচাই চলছে। Admin approve করলে এখানেই ডাউনলোড বাটন আসবে।</p>
      <button class="btn ghost" id="nBtn">🔔 Approve হলে notification পাও</button></div>`;
    $("#nBtn").onclick = async () => { toast(await enableNotif() ? "Notification চালু হয়েছে" : "Notification চালু করা যায়নি"); renderBuy(f); };
    return;
  }
  const rej = o && o.status === "rejected"
    ? `<p style="margin:8px 0"><span class="badge b-rejected">Rejected</span> ${esc(o.reason || "")} — সঠিক তথ্য দিয়ে আবার সাবমিট করো।</p>` : "";
  const bk = settings.bkash || "—", ng = settings.nagad || "—", rk = (settings.rocket || "").trim();
  const logo = (u, ch) => u ? `<img src="${esc(u)}" alt="">` : ch;
  box.innerHTML = `<div class="co">
    <div class="co-title">🔒 ${esc(T("payTitle", "সিকিউর চেকআউট"))}</div>
    ${sumBox(f)}${rej}
    <div class="co-step"><i>1</i>পেমেন্ট মাধ্যম বেছে নাও</div>
    <div class="pm" style="grid-template-columns:repeat(${rk ? 3 : 2},1fr)">
      <label class="pm-bk"><input type="radio" name="m" value="bKash" checked><span class="pm-logo">${logo(settings.bkashLogo, "b")}</span>bKash<span class="pm-tick">✓</span></label>
      <label class="pm-ng"><input type="radio" name="m" value="Nagad"><span class="pm-logo">${logo(settings.nagadLogo, "n")}</span>Nagad<span class="pm-tick">✓</span></label>
      ${rk ? `<label class="pm-rk"><input type="radio" name="m" value="Rocket"><span class="pm-logo">${logo(settings.rocketLogo, "r")}</span>Rocket<span class="pm-tick">✓</span></label>` : ""}
    </div>
    <div class="co-step"><i>2</i>টাকা পাঠাও</div>
    <div id="payInfo"></div>
    <div class="co-step"><i>3</i>পেমেন্টের তথ্য দাও</div>
    <label>${esc(T("senderLabel", "তোমার যে নম্বর থেকে পাঠিয়েছ"))}</label>
    <input id="sender" placeholder="01XXXXXXXXX" inputmode="numeric">
    <label>${esc(T("trxLabel", "Transaction ID (TrxID)"))}</label>
    <input id="trx" placeholder="যেমন: 8N7A6D5E4F">
    <button class="btn ok big" id="sub">${esc(T("submitText", "✔ অর্ডার কনফার্ম করো"))}</button>
    <div class="co-note">${esc(T("payNote", "🔒 তোমার তথ্য সুরক্ষিত। Admin যাচাইয়ের পর ডাউনলোড চালু হবে।"))}</div></div>`;
  const info = () => {
    const m = document.querySelector("input[name=m]:checked").value, num = m === "bKash" ? bk : m === "Nagad" ? ng : rk;
    const ins = T("payInstruction", "{method} (Send Money / Personal) নম্বরে {price} পাঠাও, তারপর নিচে Transaction ID দাও।").replace(/\{method\}/g, m).replace(/\{price\}/g, "৳" + f.price);
    $("#payInfo").className = "co-num " + (m === "bKash" ? "bk" : m === "Nagad" ? "ng" : "rk");
    $("#payInfo").innerHTML = `<div class="co-numrow"><div><small>${esc(m)} নম্বর</small><b>${esc(num)}</b></div><button type="button" class="copy" id="cpy">📋 Copy</button></div><p>${esc(ins)}</p>`;
    $("#cpy").onclick = () => { try { navigator.clipboard.writeText(num).then(() => toast("নম্বর কপি হয়েছে")).catch(() => toast(num)); } catch { toast(num); } };
  };
  document.querySelectorAll("input[name=m]").forEach(r => r.onchange = info); info();

  $("#sub").onclick = async () => {
    const trx = $("#trx").value.trim(), sender = $("#sender").value.trim();
    if (trx.length < 6 || sender.length < 10) return toast("সব তথ্য ঠিকভাবে দাও");
    $("#sub").disabled = true;
    try {
      await setDoc(doc(db, "orders", oid), {
        uid: user.uid, email: user.email, userName: user.displayName || "",
        fileId: f.id, fileName: f.name, price: f.price,
        method: document.querySelector("input[name=m]:checked").value,
        trxId: trx, senderNumber: sender, status: "pending", createdAt: serverTimestamp()
      });
      toast("সাবমিট হয়েছে"); renderBuy(f); enableNotif();
      if (NOTIFY_URL) user.getIdToken().then(t => fetch(NOTIFY_URL, { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + t }, body: JSON.stringify({ type: "new_order", orderId: oid }) })).catch(() => {});
    } catch (e) { toast("Error: " + e.code); $("#sub").disabled = false; }
  };
}

boot();
</script>
</body>
</html>
